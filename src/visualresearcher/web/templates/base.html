<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VisualResearcher{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <style>
    body { background:#0f1115; color:#e6e8ec; }
    .card { background:#171a21; border:1px solid #242833; }
    .chip { background:#1f2430; border:1px solid #2c3242; }
    .band-high   { background:#0f3d2a; color:#7ee2b0; border-color:#1c6e4c; }
    .band-medium { background:#3d3410; color:#e8cf74; border-color:#6e5d1c; }
    .band-low    { background:#3d1717; color:#f0a0a0; border-color:#6e2c2c; }
    .thumb { aspect-ratio: 16/10; object-fit: cover; }
    .thumb-used { outline:3px solid #4ade80; outline-offset:-3px; }
    .thumb-rejected { opacity:.28; filter:grayscale(1); }
  </style>
</head>
<body class="min-h-screen">
  <header class="border-b border-[#242833] sticky top-0 bg-[#0f1115] z-20">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4">
      <a href="/" class="font-semibold tracking-tight">VisualResearcher</a>
      <span class="text-xs text-neutral-500">{% block subtitle %}{% endblock %}</span>
      <div class="ml-auto text-xs text-neutral-500">{% block headerright %}{% endblock %}</div>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-4 py-6">{% block content %}{% endblock %}</main>
  <script src="/static/app.js"></script>
</body>
</html>
